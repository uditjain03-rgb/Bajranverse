plugins { id 'com.android.application' }
android {
  namespace 'com.bajrangverse.madtaxi'
  compileSdk 35
  defaultConfig {
    applicationId 'com.bajrangverse.madtaxi'
    minSdk 24
    targetSdk 35
    versionCode 7
    versionName '7.0.0'
  }
  buildTypes {
    release {
      minifyEnabled true      // R8: shrink and obfuscate the Java code
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  androidResources { noCompress += ['bin', 'pak'] }
}
dependencies {
  implementation 'com.google.android.gms:play-services-ads:23.6.0'   // AdMob (rewarded ads only)
  implementation 'androidx.webkit:webkit:1.12.1'
  implementation 'com.android.billingclient:billing:7.1.1'            // Google Play Billing: cars and coin packs for real money                     // serves the game files from a secure local address
}
