plugins { id 'com.android.application' }
android {
  namespace 'com.bajrangverse.piratearmy'
  compileSdk 35
  defaultConfig {
    applicationId 'com.bajrangverse.piratearmy'
    minSdk 24
    targetSdk 35
    versionCode 7
    versionName '3.0.0'
  }
  buildTypes {
    release {
      minifyEnabled true      // R8: shrink and obfuscate the Java code
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  androidResources { noCompress += ['bin'] }
}
dependencies {
  implementation 'com.google.android.gms:play-services-ads:23.6.0'   // AdMob (rewarded + interstitial ads)
  implementation 'androidx.webkit:webkit:1.12.1'                     // serves the game files from a secure local address
}
