plugins { id 'com.android.application' }
android {
  namespace 'com.bajrangverse.splashracer'
  compileSdk 35
  defaultConfig {
    applicationId 'com.bajrangverse.splashracer'
    minSdk 24
    targetSdk 35
    versionCode 4
    versionName '4.0.0'
  }
  buildTypes {
    release {
      minifyEnabled true      // R8: shrink and obfuscate the Java code
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  androidResources { noCompress += ['bin'] }
}
dependencies {
  implementation 'com.google.android.gms:play-services-ads:23.6.0'   // AdMob (rewarded ads only)
  implementation 'androidx.webkit:webkit:1.12.1'                     // serves the game files from a secure local address
}
