<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mad Taxi Masti</title>
<style>/*BASE*/
:root { --dark: #3a0a4a; --b1: #ff8ae0; --wood: #e8308a; --wood2: #a0186a; --cream: #fff0fa; --cream2: #ffd8f0; --pill: rgba(58,10,74,.78); --shade: rgba(58,10,74,.55); }
html, body { background: #3a0a4a; }
.btn.green { background: linear-gradient(#6affe0, #1ad8b0 55%, #0a9a80); }
#loading { background: #3a0a4a; }
#combo { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); font-size: 30px; color: #fff; -webkit-text-stroke: 4px var(--dark); paint-order: stroke fill; text-align: center; pointer-events: none; }
#combo b { color: #ffe04a; font-size: 40px; } #combo small { display: block; font-size: 18px; color: #7affe8; }
#combo.pop { animation: pop .25s; }
#wanted { position: absolute; right: 12px; top: calc(56px + var(--sat) + var(--cabH, 180px)); font-size: 24px; letter-spacing: 2px; pointer-events: none; }
#wanted i { font-style: normal; color: rgba(255,255,255,.35); -webkit-text-stroke: 2px var(--dark); paint-order: stroke fill; }
#wanted i.on { color: #ff3a3a; } #wanted.hot { animation: blink .4s infinite; }
#powerP { position: absolute; left: 10px; bottom: calc(132px + var(--sab)); pointer-events: none; font-size: 16px; }
#logo .a { font-size: min(58px, 13.5vw); color: #fff; } #logo .b { background: linear-gradient(#6affe0, #1ad8b0); color: #3a0a4a; }
#home { background: linear-gradient(rgba(40,0,50,0), rgba(40,0,50,0) 55%, rgba(40,0,50,.6)); }
#cabFrame { position: absolute; right: 10px; top: calc(62px + var(--sat)); border: 4px solid var(--dark); border-radius: 16px; box-shadow: 0 4px 0 var(--dark); pointer-events: none; overflow: hidden; }
#cabFrame .live { position: absolute; left: 6px; top: 4px; font-size: 10px; background: rgba(0,0,0,.55); color: #fff; padding: 1px 6px; border-radius: 8px; letter-spacing: .5px; }
#cabFrame .live i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ff3a3a; margin-right: 4px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
#cabFrame .fx { position: absolute; right: 6px; top: 18px; font-size: 26px; transition: opacity .2s; }
#cabFrame .nm { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(58,10,74,.85); color: #ffd8f0; font-size: 12px; text-align: center; padding: 2px 0; }
#cabFrame.shake { animation: cabShake .35s; }
@keyframes cabShake { 20% { transform: translate(-4px, 3px) rotate(-2deg); } 50% { transform: translate(4px, -3px) rotate(2deg); } 80% { transform: translate(-2px, 1px); } }
#mission { position: absolute; left: 10px; top: calc(62px + var(--sat)); width: calc(100% - 20px - var(--cabW, 150px) - 14px); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
#moodBox { background: var(--pill); border: 3px solid var(--dark); border-radius: 14px; padding: 5px 8px; color: #fff; }
#moodBox .l { display: flex; justify-content: space-between; font-size: 13px; }
#moodBar { height: 12px; border-radius: 6px; background: rgba(255,255,255,.18); margin-top: 3px; overflow: hidden; }
#moodFill { height: 100%; width: 50%; border-radius: 6px; background: linear-gradient(90deg, #ff4f6a, #ffd23f 45%, #3fcf6e); background-size: var(--bw, 300px) 100%; transition: width .25s; }
#goal { background: var(--pill); border: 3px solid var(--dark); border-radius: 14px; padding: 4px 8px; color: #7affe8; font-size: 17px; }
#goal.warn { color: #ff8a8a; animation: wobble .5s infinite; }
#dist { background: var(--pill); border: 3px solid var(--dark); border-radius: 14px; padding: 3px 8px; color: #b8f0ff; font-size: 14px; }
#speedo { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(26px + var(--sab)); background: var(--pill); border: 4px solid var(--dark); border-radius: 18px; padding: 2px 14px; color: #fff; font-size: 26px; text-align: center; pointer-events: none; min-width: 92px; }
#speedo small { display: block; font-size: 10px; color: #ffd23f; margin-top: -4px; }
#brakeB { left: 12px; right: auto; background: radial-gradient(#ff6a5a, #c8302a); }
#hornB { right: 112px; width: 72px; height: 72px; bottom: calc(30px + var(--sab)); background: radial-gradient(#ffe066, #ff9a1a); }
#turboB span:first-child, #brakeB span:first-child, #hornB span:first-child { font-size: 30px; line-height: 1; }
#hornB span:first-child { font-size: 26px; }
#brakeB.on { transform: scale(.92); filter: brightness(1.2); }
#bubble { top: auto; bottom: calc(132px + var(--sab)); }
.review { background: #fff6e0; color: var(--dark); border: 3px solid var(--dark); border-radius: 14px; padding: 8px 12px; margin: 8px 0; font-size: 16px; text-align: left; }
.review .who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #c8302a; }
.review canvas { width: 44px; height: 44px; border-radius: 50%; background: #cfe6f5; border: 2px solid var(--dark); }
.mcard { display: flex; gap: 10px; align-items: center; text-align: left; background: #fff6e0; color: var(--dark); border: 3px solid var(--dark); border-radius: 16px; padding: 8px; margin: 8px 0; }
.mcard canvas { width: 72px; height: 72px; border-radius: 50%; background: #cfe6f5; border: 3px solid var(--dark); flex: none; }
.mcard b { font-size: 19px; color: #c8302a; display: block; } .mcard span { font-size: 15px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
  <div id="top"><button class="btn" id="pauseB">❚❚</button><div class="pill out" id="lvl">RIDE 1</div><div class="pill out">₹ <span id="coinN">0</span></div></div>
  <div id="mission">
    <div id="moodBox"><div class="l"><span id="moodName">MOOD</span><span id="moodE">😀</span></div><div id="moodBar"><div id="moodFill"></div></div></div>
    <div id="goal">⏱ 0:00</div>
    <div id="dist">🏁 0 m</div>
  </div>
  <div id="cabFrame"><div class="live"><i></i>BACK SEAT</div><div class="fx" id="cabFx"></div><div class="nm" id="cabName"></div></div>
  <div id="bubble" class="hidden"><canvas id="bubbleFace" width="64" height="64"></canvas><div><b id="bubbleName"></b><span id="bubbleText"></span></div></div>
  <div id="wanted"></div>
  <div id="combo" class="hidden"></div>
  <div class="pill out hidden" id="powerP"></div>
  <div id="pops"></div>
  <div id="banner"></div>
  <button class="roundB" id="brakeB"><span>🛑</span><b>BRAKE</b></button>
  <div id="speedo"><span id="kmh">0</span><small>KM/H</small></div>
  <button class="roundB" id="hornB"><span>📯</span><b>HORN</b></button>
  <button class="roundB" id="turboB"><span>⚡</span><b>TURBO</b><span class="n" id="turboN">1</span></button>
  <div id="hint" class="hidden"></div>
</div>
<div id="home" class="screen hidden">
  <div id="homeTop"><div class="pill out">₹ <span id="homeCoins">0</span></div><button class="btn small" id="setB">⚙️</button></div>
  <div id="logo"><div class="s">🚕💥🐄🚓</div><div class="a">MAD TAXI<br>MASTI</div><div class="b">CRAZY PASSENGERS!</div></div>
  <div id="homeBottom">
    <div id="homeLevel">RIDE 1</div>
    <button class="btn big green" id="playB">DRIVE!</button>
    <div id="homeRow"><button class="btn" id="garageB">🔧 GARAGE</button><button class="btn" id="giftB">🎁 GIFT</button></div>
    <div id="credit">BajrangVerse Studios</div>
  </div>
</div>
<div id="modal" class="screen modal hidden"><div class="panel" id="modalBody"></div></div>
<div id="flash"></div>
<div id="loading">🚕 Loading…</div>
<div id="studio"><img src="logo.jpg" alt="BajrangVerse Studios"><div class="presents">PRESENTS</div></div>
<script src="game.js"></script>
</body>
</html>
