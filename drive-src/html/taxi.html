<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mad Taxi Masti</title>
<style>/*BASE*/
:root { --dark: #3a0a4a; --b1: #ff8ae0; --wood: #e8308a; --wood2: #a0186a; --cream: #fff0fa; --cream2: #ffd8f0; --pill: rgba(58,10,74,.78); --shade: rgba(58,10,74,.55); }
html, body { background: #3a0a4a; }
.btn.green { background: linear-gradient(#6affe0, #1ad8b0 55%, #0a9a80); }
#loading { background: #3a0a4a; }
#combo { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); font-size: 30px; color: #fff; -webkit-text-stroke: 4px var(--dark); paint-order: stroke fill; text-align: center; pointer-events: none; }
#combo b { color: #ffe04a; font-size: 40px; } #combo small { display: block; font-size: 18px; color: #7affe8; }
#combo.pop { animation: pop .25s; }
#wanted { position: absolute; right: 12px; top: calc(56px + var(--sat) + var(--cabH, 180px)); font-size: 24px; letter-spacing: 2px; pointer-events: none; }
#wanted i { font-style: normal; color: rgba(255,255,255,.35); -webkit-text-stroke: 2px var(--dark); paint-order: stroke fill; }
#wanted i.on { color: #ff3a3a; } #wanted.hot { animation: blink .4s infinite; }
#powerP { position: absolute; left: 10px; bottom: calc(132px + var(--sab)); pointer-events: none; font-size: 16px; }
#logo .a { font-size: min(58px, 13.5vw); color: #fff; } #logo .b { background: linear-gradient(#6affe0, #1ad8b0); color: #3a0a4a; }
#home { background: linear-gradient(rgba(40,0,50,0), rgba(40,0,50,0) 55%, rgba(40,0,50,.6)); }
#cabFrame { position: absolute; right: 10px; top: calc(62px + var(--sat)); border: 4px solid var(--dark); border-radius: 16px; box-shadow: 0 4px 0 var(--dark); pointer-events: none; overflow: hidden; }
#cabFrame .live { position: absolute; left: 6px; top: 4px; font-size: 10px; background: rgba(0,0,0,.55); color: #fff; padding: 1px 6px; border-radius: 8px; letter-spacing: .5px; }
#cabFrame .live i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ff3a3a; margin-right: 4px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
#cabFrame .fx { position: absolute; right: 6px; top: 18px; font-size: 26px; transition: opacity .2s; }
#cabFrame .nm { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(58,10,74,.85); color: #ffd8f0; font-size: 12px; text-align: center; padding: 2px 0; }
#cabFrame.shake { animation: cabShake .35s; }
@keyframes cabShake { 20% { transform: translate(-4px, 3px) rotate(-2deg); } 50% { transform: translate(4px, -3px) rotate(2deg); } 80% { transform: translate(-2px, 1px); } }
#mission { position: absolute; left: 10px; top: calc(62px + var(--sat)); width: calc(100% - 20px - var(--cabW, 150px) - 14px); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
#moodBox { background: var(--pill); border: 3px solid var(--dark); border-radius: 14px; padding: 5px 8px; color: #fff; }
#moodBox .l { display: flex; justify-content: space-between; font-size: 13px; }
#moodBar { height: 12px; border-radius: 6px; background: rgba(255,255,255,.18); margin-top: 3px; overflow: hidden; }
#moodFill { height: 100%; width: 50%; border-radius: 6px; background: linear-gradient(90deg, #ff4f6a, #ffd23f 45%, #3fcf6e); background-size: var(--bw, 300px) 100%; transition: width .25s; }
#goal { background: var(--pill); border: 3px solid var(--dark); border-radius: 14px; padding: 4px 8px; color: #7affe8; font-size: 17px; }
#goal.warn { color: #ff8a8a; animation: wobble .5s infinite; }
#dist { background: var(--pill); border: 3px solid var(--dark); border-radius: 14px; padding: 3px 8px; color: #b8f0ff; font-size: 14px; }
#speedo { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(26px + var(--sab)); background: var(--pill); border: 4px solid var(--dark); border-radius: 18px; padding: 2px 14px; color: #fff; font-size: 26px; text-align: center; pointer-events: none; min-width: 92px; }
#speedo small { display: block; font-size: 10px; color: #ffd23f; margin-top: -4px; }
#hornB { background: radial-gradient(#ffe066, #ff9a1a); }
#turboB span:first-child, #brakeB span:first-child, #hornB span:first-child { font-size: 30px; line-height: 1; }
#hornB span:first-child { font-size: 26px; }
#brakeB.on { transform: scale(.92); filter: brightness(1.2); }
#bubble { top: auto; bottom: calc(132px + var(--sab)); }
.review { background: #fff6e0; color: var(--dark); border: 3px solid var(--dark); border-radius: 14px; padding: 8px 12px; margin: 8px 0; font-size: 16px; text-align: left; }
.review .who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #c8302a; }
.review canvas { width: 44px; height: 44px; border-radius: 50%; background: #cfe6f5; border: 2px solid var(--dark); }
.mcard { display: flex; gap: 10px; align-items: center; text-align: left; background: #fff6e0; color: var(--dark); border: 3px solid var(--dark); border-radius: 16px; padding: 8px; margin: 8px 0; }
.mcard canvas { width: 72px; height: 72px; border-radius: 50%; background: #cfe6f5; border: 3px solid var(--dark); flex: none; }
.mcard b { font-size: 19px; color: #c8302a; display: block; } .mcard span { font-size: 15px; }
#tasks { background: rgba(58,10,74,.62); border: 3px solid var(--dark); border-radius: 12px; padding: 3px 7px; color: #fff; font-size: 12px; line-height: 1.35; }
#tasks div b { color: #ffe04a; float: right; margin-left: 6px; } #tasks div.ok { color: #7aff9a; }
#carName { color: #fff; font-size: 15px; -webkit-text-stroke: 3px var(--dark); paint-order: stroke fill; margin-bottom: 2px; }
#playRow { display: flex; gap: 10px; align-items: center; justify-content: center; }
#mayhemB { padding: 8px 12px; font-size: 26px; line-height: 1; background: linear-gradient(#ffb03a, #ff6a1a 55%, #c83a0a); } #mayhemB small { display: block; font-size: 12px; }
.modal.sheet { background: transparent; justify-content: flex-end; align-items: center; pointer-events: none; padding: 0; }
.modal.sheet .panel { pointer-events: auto; width: min(100vw, 520px); max-height: 54vh; border-radius: 26px 26px 0 0; border-bottom: 0; padding: 10px 10px calc(10px + var(--sab)); animation: up .25s; }
@keyframes up { from { transform: translateY(60%); } }
.gtop { display: flex; justify-content: space-between; align-items: center; font-size: 18px; margin-bottom: 6px; } .gtop .pill { font-size: 16px; }
.adfree { width: 100%; margin-bottom: 6px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 6px; } .tab { flex: none; border: 3px solid var(--dark); border-radius: 12px; padding: 5px 9px; background: #fff; color: var(--dark); font: inherit; font-size: 13px; }
.tab.on { background: var(--wood); color: #fff; }
.gbody { text-align: left; } .item.sel { outline: 3px solid #1ad8b0; } .item .st { font-size: 10px; line-height: 1.6; display: block; color: #6a3a7a; }
i.bar { display: inline-block; width: 46px; height: 7px; border-radius: 4px; background: #e8d0e8; margin: 0 6px 0 2px; vertical-align: middle; overflow: hidden; } i.bar u { display: block; height: 100%; background: linear-gradient(90deg, #1ad8b0, #ff4fa8); }
.btn.try { background: linear-gradient(#7ac8ff, #2f8cf0 55%, #1a5ab0); margin-left: 4px; }
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .sw { position: relative; border: 3px solid var(--dark); border-radius: 12px; padding: 4px; text-align: center; background: #fff; font-size: 11px; }
.sw i { display: block; height: 30px; border-radius: 8px; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.7), transparent 40%), var(--c); border: 2px solid rgba(0,0,0,.25); } .sw b { display: block; font-size: 10px; line-height: 1.1; margin-top: 2px; } .sw span { color: #c8302a; }
.sw.on { outline: 3px solid #1ad8b0; } .sw em { position: absolute; top: -6px; right: -6px; font-style: normal; background: #2f8cf0; border-radius: 8px; border: 2px solid var(--dark); padding: 0 3px; }
.stages { display: flex; flex-direction: column; gap: 8px; text-align: left; } .stage { display: flex; gap: 8px; align-items: center; border: 3px solid var(--dark); border-radius: 16px; padding: 6px; background: linear-gradient(135deg, var(--g1), var(--g2)); }
.stage .si { font-size: 34px; } .stage .sn { flex: 1; color: #fff; -webkit-text-stroke: 3px var(--dark); paint-order: stroke fill; } .stage .sn b { font-size: 18px; display: block; } .stage .sn span { display: block; font-size: 11px; -webkit-text-stroke: 2px var(--dark); }
.stage .sb { display: flex; flex-direction: column; gap: 6px; } .stage .sb .btn { font-size: 12px; padding: 6px 8px; }
.stat.no { opacity: .6; }
/* the pedals: GAS on the right, BRAKE on the left */
.pedal { position: absolute; bottom: calc(18px + var(--sab)); width: 76px; height: 116px; border: 4px solid var(--dark); border-radius: 14px 14px 22px 22px; background: repeating-linear-gradient(180deg, #4a4a52 0 10px, #34343a 10px 14px); box-shadow: 0 6px 0 var(--dark), inset 0 3px 0 rgba(255,255,255,.25); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 8px; transform-origin: 50% 100%; transition: transform .08s; touch-action: none; }
.pedal i { position: absolute; top: 8px; left: 10px; right: 10px; height: 10px; border-radius: 5px; background: #ff4a3a; }
.pedal.gas i { background: #3aff8a; }
.pedal b { font-size: 14px; -webkit-text-stroke: 3px var(--dark); paint-order: stroke fill; letter-spacing: 1px; }
#brakeB { left: 12px; } #gasB { right: 12px; }
.pedal.on { transform: perspective(240px) rotateX(24deg) scale(.96); filter: brightness(1.3); box-shadow: 0 2px 0 var(--dark); }
.pedal.gas.ready { animation: glow .6s ease-in-out infinite alternate; }
#turboB { right: 12px; bottom: calc(146px + var(--sab)); width: 80px; height: 80px; }
#hornB { right: 100px; bottom: calc(150px + var(--sab)); width: 68px; height: 68px; }
#speedo { bottom: calc(22px + var(--sab)); }
#powerP { bottom: calc(150px + var(--sab)); }
#bubble { bottom: calc(236px + var(--sab)); }
/* MAD RACE: the job bar is the fuel gauge in the MAD RACE */
#hud.mayhem #moodFill { background: linear-gradient(90deg, #ff3a2a, #ffb03a 30%, #ffe04a 60%, #3fcf6e); }
#moodBox.low { animation: blink .4s infinite; }
#tasks .th { color: #ffb03a; font-size: 11px; letter-spacing: 1px; }
#tasks .dare { position: relative; padding-bottom: 5px; font-size: 14px; } #tasks .dare b { color: #ff7ad8; float: none; margin: 0 4px 0 0; } #tasks .dare span { float: right; color: #ffe04a; }
#tasks .dare i { position: absolute; left: 0; bottom: 0; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #ff4f6a, #ffe04a); }
#tasks .dnext { color: #b8f0ff; font-size: 12px; }
.btn.gold { background: linear-gradient(#ffe86a, #ffc21a 55%, #c8901a); margin-left: 4px; }
.grow { display: flex; gap: 6px; justify-content: center; margin-bottom: 6px; } .grow .btn { flex: 1; }
.item .bt { display: flex; flex-direction: column; gap: 4px; align-items: stretch; } .item .bt .btn { margin: 0; }
.gbody h4 { margin: 10px 2px 4px; font-size: 15px; color: #a0186a; }
#studio .kids { position: absolute; bottom: calc(18px + var(--sab)); left: 0; right: 0; text-align: center; font-family: 'Fredoka'; font-weight: 600; font-size: 13px; color: #9a8a7a; letter-spacing: 2px; animation: fadeIn 1s 1.2s both; }
#homeRow { gap: 6px; } #homeRow .btn { padding: 10px 12px; font-size: 18px; } #homeRow #shopB, #homeRow #giftB { padding: 10px 10px; font-size: 20px; }
button, .sw, .item, .tab { touch-action: manipulation; }
.pedal { pointer-events: auto; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#throwB { left: 12px; right: auto; bottom: calc(146px + var(--sab)); width: 84px; height: 84px; display: none; background: radial-gradient(#ffb0e0, #ff4fa8); }
#hud.throwjob #throwB { display: flex; }
#throwB span:first-child { font-size: 32px; line-height: 1; }
#hud #cabFrame { display: none; } #mission { width: calc(100% - 20px); }
#tasks .tip { color: #fff; font-size: 13px; }
#wanted { top: calc(232px + var(--sat)); right: 10px; background: var(--pill); border: 3px solid var(--dark); border-radius: 12px; padding: 0 6px; font-size: 18px; } #wanted:empty { display: none; }
#homeLevel small { display: block; }
.panel { position: relative; } .xB { position: sticky; top: 0; float: right; z-index: 3; margin: -6px -4px 0 0; }
.ico.car { width: 96px; height: 60px; flex: none; display: flex; align-items: center; justify-content: center; background: radial-gradient(#ffffff, #e8d8f0); border-radius: 12px; border: 2px solid rgba(58,10,74,.25); }
.ico.car img { width: 96px; height: 60px; object-fit: contain; }
#tasks .tip.rush { color: #ffe04a; font-size: 16px; animation: blink .5s infinite; }
#snap { position: absolute; right: 14px; top: 38%; width: 120px; padding: 8px 8px 10px; background: #fff; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.4); transform: translateX(160%) rotate(8deg); text-align: center; color: #3a0a4a; pointer-events: none; }
#snap.show { animation: snap 2.2s ease both; } #snap i { display: block; font-style: normal; font-size: 30px; background: linear-gradient(#7ac8ff, #ffd8a0); border-radius: 4px; padding: 10px 0; } #snap b { display: block; font-size: 20px; } #snap span { font-size: 10px; color: #ff4fa8; }
@keyframes snap { 0% { transform: translateX(160%) rotate(8deg); } 15%, 80% { transform: translateX(0) rotate(-4deg); } 100% { transform: translateX(160%) rotate(8deg); } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
  <div id="top"><button class="btn" id="pauseB">❚❚</button><div class="pill out" id="lvl">RIDE 1</div><div class="pill out">🪙 <span id="coinN">0</span></div></div>
  <div id="mission">
    <div id="moodBox"><div class="l"><span id="moodName">MOOD</span><span id="moodE">😀</span></div><div id="moodBar"><div id="moodFill"></div></div></div>
    <div id="goal">⏱ 0:00</div>
    <div id="dist">🏁 0 m</div>
    <div id="tasks"></div>
  </div>
  <div id="cabFrame"><div class="live"><i></i>BACK SEAT</div><div class="fx" id="cabFx"></div><div class="nm" id="cabName"></div></div>
  <div id="bubble" class="hidden"><canvas id="bubbleFace" width="64" height="64"></canvas><div><b id="bubbleName"></b><span id="bubbleText"></span></div></div>
  <div id="wanted"></div>
  <div id="combo" class="hidden"></div>
  <div class="pill out hidden" id="powerP"></div>
  <div id="pops"></div>
  <div id="banner"></div>
  <button class="pedal" id="brakeB"><i></i><b>BRAKE</b></button>
  <div id="speedo"><span id="kmh">0</span><small>KM/H</small></div>
  <button class="pedal gas" id="gasB"><i></i><b>GAS</b></button>
  <button class="roundB" id="hornB"><span>📯</span><b>HORN</b></button>
  <button class="roundB" id="throwB"><span>🎁</span><b>THROW</b></button>
  <button class="roundB" id="turboB"><span>⚡</span><b>TURBO</b><span class="n" id="turboN">1</span></button>
  <div id="hint" class="hidden"></div>
  <div id="snap"></div>
</div>
<div id="home" class="screen hidden">
  <div id="homeTop"><div class="pill out">🪙 <span id="homeCoins">0</span></div><button class="btn small" id="setB">⚙️</button></div>
  <div id="logo"><div class="s">🚕💥🐄🚓</div><div class="a">MAD TAXI<br>MASTI</div><div class="b">CRAZY PASSENGERS!</div></div>
  <div id="homeBottom">
    <div id="carName"></div>
    <div id="homeLevel">RIDE 1</div>
    <div id="playRow"><button class="btn big green" id="playB">DRIVE!</button><button class="btn" id="mayhemB">🏁<small>MAD RACE</small></button></div>
    <div id="homeRow"><button class="btn" id="garageB">🔧 GARAGE</button><button class="btn" id="stagesB">🗺️ STAGES</button><button class="btn" id="shopB">🛒</button><button class="btn" id="giftB">🎁</button></div>
    <div id="credit">BajrangVerse Studios</div>
  </div>
</div>
<div id="modal" class="screen modal hidden"><div class="panel" id="modalBody"></div></div>
<div id="flash"></div>
<div id="loading">🚕 Loading…</div>
<div id="studio"><img src="logo.jpg" alt="BajrangVerse Studios"><div class="presents">PRESENTS</div><div class="kids">Ayaansh &amp; Aadhya</div></div>
<script src="game.js"></script>
</body>
</html>
