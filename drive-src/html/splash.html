<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Splash Racer</title>
<style>/*BASE*/
/* ocean theme: deep navy outlines, aqua buttons, coral accents, white-foam panels */
:root { --dark: #062a52; --b1: #5ae8ff; --wood: #18a8e8; --wood2: #0a62b8; --cream: #eefcff; --cream2: #c8f2ff; --pill: rgba(6,42,82,.72); --shade: rgba(6,42,82,.55); }
html, body { background: #0a6ab0; }
.btn.green { background: linear-gradient(#ffb08a, #ff6a5a 55%, #d8384a); }
#logo .a { font-size: min(64px, 15vw); color: #fff; } #logo .b { background: linear-gradient(#ff8a7a, #ff4a6a); }
#logo .s { font-size: 40px; }
#home { background: linear-gradient(rgba(4,40,90,0), rgba(4,40,90,0) 55%, rgba(4,40,90,.6)); }
#loading { background: #0a6ab0; }
#strip .dot.me { border-color: #ff6a5a; }
#stripLine { overflow: hidden; } #progFill { height: 100%; width: 0; background: linear-gradient(90deg, #5ae8ff, #ffffff); }
#itemB { left: 12px; right: auto; background: radial-gradient(#ffb8f0, #c84ab8); }
#itemB span:first-child { font-size: 36px; line-height: 1; }
#nitroB span:first-child { font-size: 30px; line-height: 1; }
.row.wrap { flex-wrap: wrap; gap: 6px; }
#splashO, #inkO { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s; }
#splashO { background: radial-gradient(circle at 30% 40%, rgba(200,240,255,.75) 0 9%, transparent 10%), radial-gradient(circle at 70% 30%, rgba(200,240,255,.7) 0 7%, transparent 8%), radial-gradient(circle at 55% 70%, rgba(200,240,255,.7) 0 11%, transparent 12%), radial-gradient(circle at 20% 80%, rgba(200,240,255,.6) 0 6%, transparent 7%), rgba(140,210,255,.25); }
#inkO { background: radial-gradient(circle at 40% 45%, rgba(30,10,50,.92) 0 14%, transparent 15%), radial-gradient(circle at 70% 60%, rgba(30,10,50,.9) 0 11%, transparent 12%), radial-gradient(circle at 25% 70%, rgba(30,10,50,.85) 0 9%, transparent 10%), radial-gradient(circle at 60% 25%, rgba(30,10,50,.85) 0 8%, transparent 9%); }
#splashO.show, #inkO.show { opacity: 1; transition: opacity .05s; }
#playRow { display: flex; gap: 10px; align-items: stretch; }
#raceB { padding: 8px 12px; font-size: 26px; line-height: 1; background: linear-gradient(#ffd84a, #ffa21a 55%, #d86a0a); } #raceB small { display: block; font-size: 12px; }
#studio .kids { position: absolute; bottom: calc(18px + var(--sab)); left: 0; right: 0; text-align: center; font-family: 'Fredoka'; font-weight: 600; font-size: 13px; color: #9a8a7a; letter-spacing: 2px; animation: fadeIn 1s 1.2s both; }
#homeLevel small { display: block; }
#hud:not(.rescue) #savedP { display: none; }
#hud.rescue #itemB { display: none; }
#powC { position: absolute; left: 12px; top: calc(146px + var(--sat)); display: flex; gap: 6px; pointer-events: none; }
#powC span { background: radial-gradient(#8affa8, #10a03a); border: 3px solid #fff; border-radius: 50%; width: 44px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; line-height: 1; box-shadow: 0 0 12px #3aff6a; }
#powC small { font-size: 11px; color: #fff; -webkit-text-stroke: 2px #063a12; paint-order: stroke fill; font-family: 'Fredoka'; }
#sharkW { position: absolute; left: 50%; bottom: calc(190px + var(--sab)); transform: translateX(-50%); background: #e8202a; color: #fff; font-family: 'Fredoka'; font-weight: 700; font-size: 22px; padding: 6px 16px; border-radius: 20px; border: 3px solid #fff; opacity: 0; transition: opacity .2s; pointer-events: none; }
#sharkW.show { opacity: 1; animation: sharkP .5s infinite alternate; }
@keyframes sharkP { to { transform: translateX(-50%) scale(1.12); } }
#strip .home { position: absolute; top: 2px; transform: translateX(-50%); font-size: 16px; pointer-events: none; }
.ico.boat { width: 84px; background: none; } .ico.boat img { width: 84px; height: 52px; object-fit: contain; }
.item.sel { outline: 3px solid #ffd23f; }
.saved { font-size: 18px; text-align: center; letter-spacing: 2px; margin: 4px 0; }
.legend { display: flex; flex-direction: column; gap: 8px; text-align: left; margin: 6px 0 10px; }
.lg { display: flex; gap: 10px; align-items: center; } .lg span { display: block; font-size: 13px; opacity: .9; }
.lg i { font-style: normal; flex: 0 0 46px; height: 46px; border-radius: 50%; background: var(--c); border: 3px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; box-shadow: 0 0 10px var(--c); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="splashO"></div><div id="inkO"></div>
<div id="hud" class="hidden">
  <div id="top"><button class="btn" id="pauseB">❚❚</button><div class="pill out" id="placeN">6<small>th</small></div><div class="pill out" id="savedP">❤️ <span id="savedN">0/0</span></div><div class="pill out">🪙 <span id="coinN">0</span></div></div>
  <div id="powC"></div><div id="sharkW">🦈</div>
  <div id="strip"></div>
  <div id="bubble" class="hidden"><canvas id="bubbleFace" width="64" height="64"></canvas><div><b id="bubbleName"></b><span id="bubbleText"></span></div></div>
  <div class="pill out" id="lvl" style="position:absolute;left:12px;top:calc(112px + var(--sat));font-size:13px">LAGOON</div>
  <div id="pops"></div>
  <div id="banner"></div>
  <button class="roundB" id="itemB"><span id="itemI">❔</span><b>ITEM</b></button>
  <button class="roundB" id="nitroB"><span>⚡</span><b>NITRO</b><span class="n" id="nitroN">1</span></button>
  <div id="hint" class="hidden"></div>
</div>
<div id="home" class="screen hidden">
  <div id="homeTop"><div class="pill out">🪙 <span id="homeCoins">0</span></div><button class="btn small" id="setB">⚙️</button></div>
  <div id="logo"><div class="s">🐶🚤🐧</div><div class="a">SPLASH<br>RACER</div><div class="b">ANIMAL RESCUE ON WILD WATER!</div></div>
  <div id="homeBottom">
    <div id="homeLevel">RESCUE 1</div>
    <div id="playRow"><button class="btn big green" id="playB">🐾 RESCUE!</button><button class="btn" id="raceB">🏁<small id="raceN">RACE 1</small></button></div>
    <div id="homeRow"><button class="btn" id="garageB">🛥️ BOATS</button><button class="btn" id="giftB">🎁 GIFT</button></div>
    <div id="credit">BajrangVerse Studios</div>
  </div>
</div>
<div id="modal" class="screen modal hidden"><div class="panel" id="modalBody"></div></div>
<div id="flash"></div>
<div id="loading">🌊 Loading…</div>
<div id="studio"><img src="logo.jpg" alt="BajrangVerse Studios"><div class="presents">PRESENTS</div><div class="kids">Ayaansh &amp; Aadhya</div></div>
<script src="game.js"></script>
</body>
</html>
